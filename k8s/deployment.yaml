apiVersion: v1
kind: Deployment
metadata: 
  name: platform-api
  namespace: platform
  labels:
    app: plaform-api
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: platform-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadate:
      labels:
        app: platform-api
        version: "1.0.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: platform-api
        image: platform-api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
          name: http
        envFrom:
        - configMapRef:
            name: platform-api-config
        env:
        - name: APP_VERSION
          value: "1.0.0"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /ready
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
        securityContext:
          allowPrivilageEscalation: false
          readOnlyRootFileSysem: true
          capabilities:
            drop: ["ALL"]



